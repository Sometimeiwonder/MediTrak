version: '3.8'

services:
  meditrack:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meditrack-app
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/MediTrack.db
    volumes:
      - meditrack-data:/app/data
      - meditrack-logs:/app/logs
    restart: unless-stopped

volumes:
  meditrack-data:
  meditrack-logs:
